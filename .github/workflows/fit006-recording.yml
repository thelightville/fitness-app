name: Reviewed FIT006 trainer recording
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: fit006-recording-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  source:
    if: github.event.pull_request.head.ref == 'fix/fit006-trainer-recording-20261103' && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    outputs:
      source: ${{ steps.review.outputs.source }}
    steps:
      - name: Admit only exact reviewed implementation before tooling
        id: review
        env:
          TOKEN: ${{ github.token }}
          SOURCE: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import os,json,re,time,urllib.request
          sha=os.environ['SOURCE'];prnum=os.environ['PR'];assert re.fullmatch('[a-f0-9]{40}',sha)and prnum.isdigit()
          def get(path):
              req=urllib.request.Request('https://api.github.com/repos/thelightville/fitness-app'+path,headers={'Authorization':'Bearer '+os.environ['TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=20)as r:return json.load(r)
          for attempt in range(90):
              pr=get('/pulls/'+prnum)
              assert pr['state']=='open'and not pr['merged']and not pr['draft']and pr['user']['login']=='Kariya-AI'and pr['base']['ref']=='main'and pr['head']['sha']==sha and pr['head']['repo']['full_name']=='thelightville/fitness-app'and pr['head']['ref']=='fix/fit006-trainer-recording-20261103'
              reviews=[r for r in get('/pulls/'+prnum+'/reviews?per_page=100')if r['commit_id']==sha]
              assert not any(r['state']=='CHANGES_REQUESTED'for r in reviews)
              if any(r['state']=='APPROVED'and r['user']['login']=='thelightville'for r in reviews):
                  with open(os.environ['GITHUB_OUTPUT'],'a')as f:f.write('source='+sha+'\n')
                  break
              if attempt==89:raise RuntimeError('Exact review unavailable, no tooling admitted')
              time.sleep(10)
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.review.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact clean source before package tooling
        run: python3 qa/fit006-recording/verify-source.py '${{ steps.review.outputs.source }}'
      - name: Real Git refusal cases
        run: python3 qa/fit006-recording/tests/source-binding.py
  contracts:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.source.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 qa/fit006-recording/verify-source.py '${{ needs.source.outputs.source }}'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Install only isolated exact compiler lock without lifecycle
        working-directory: qa/fit006-recording
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Actual source and compiled function role contracts
        run: |
          node qa/fit006-recording/tests/recording-contract.cjs qa/fit006-recording/candidate/source/src/components/dashboard/trainer-progress-form.tsx
          node qa/fit006-recording/tests/manage-contract.cjs qa/fit006-recording/existing/manage-function.json qa/fit006-recording/existing/measurements-route.ts
          node qa/fit006-recording/tests/namespace-contract.cjs qa/fit006-recording
      - name: Python overlay syntax and immutable source
        run: |
          python3 - <<'PY'
          import ast,pathlib
          ast.parse(pathlib.Path('qa/fit006-recording/verify-source.py').read_text())
          PY
          python3 qa/fit006-recording/verify-source.py '${{ needs.source.outputs.source }}'
