name: Fitness pilot release candidate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
        env:
          POSTGRES_USER: fitnessfixture
          POSTGRES_PASSWORD: fitnessfixture
          POSTGRES_DB: fitnessfixture
        ports:
          - 55447:5432
        options: --health-cmd "pg_isready -U fitnessfixture" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fitnessfixture:fitnessfixture@127.0.0.1:55447/fitnessfixture
      AUTH_SECRET: synthetic-local-test-secret-never-used-in-production
      AUTH_TRUST_HOST: 'true'
      AUTH_URL: http://127.0.0.1:3100
      FITNESS_FIXTURE_ORIGIN: http://127.0.0.1:3100
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: npm
      - name: Install, migrate and build the image
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run db:generate
          npm run db:deploy
          npm audit --omit=dev --audit-level=high
          docker build -f Dockerfile.pilot --build-arg FITNESS_BUILD_REVISION="$(git rev-parse HEAD)" -t fitness-pilot .
      - name: Test the web image and native API against a disposable database
        run: |
          docker run --detach --name fitness-pilot --network host \
            -e DATABASE_URL -e AUTH_SECRET -e AUTH_TRUST_HOST -e AUTH_URL -e PORT=3100 fitness-pilot
          trap 'docker logs fitness-pilot; docker rm -f fitness-pilot' EXIT
          node --test scripts/test-pilot.mjs

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Test the Android client and install the pinned SDK components
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test -- --runInBand
          npm audit --omit=dev --audit-level=high
          sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Build and verify an isolated, test-signed pilot APK
        working-directory: mobile/android
        env:
          FITNESS_ANDROID_PILOT: 'true'
          FITNESS_UPLOAD_KEY_ALIAS: fitness-pilot
          FITNESS_UPLOAD_STORE_PASSWORD: fixture-only
          FITNESS_UPLOAD_KEY_PASSWORD: fixture-only
        run: |
          export JAVA_HOME="${JAVA_HOME_17_X64:?Java 17 is required}"
          export PATH="$JAVA_HOME/bin:$PATH"
          export FITNESS_UPLOAD_STORE_FILE="$RUNNER_TEMP/fitness-pilot.p12"
          keytool -genkeypair -storetype PKCS12 -keystore "$FITNESS_UPLOAD_STORE_FILE" \
            -alias "$FITNESS_UPLOAD_KEY_ALIAS" -storepass "$FITNESS_UPLOAD_STORE_PASSWORD" \
            -keypass "$FITNESS_UPLOAD_KEY_PASSWORD" -keyalg RSA -keysize 2048 \
            -validity 30 -dname 'CN=Fitness disposable pilot fixture'
          ./gradlew --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64 :app:assembleRelease
          cd app/build/outputs/apk/release
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs app-release.apk
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging app-release.apk | grep "package: name='ng.myapps.fitness.pilot'"
          sha256sum app-release.apk | tee -a "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
