services:
  db:
    image: postgres:15-alpine
    container_name: fitness-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitness_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitness_password}
      POSTGRES_DB: ${POSTGRES_DB:-fitness_db}
    user: "70:70"
    volumes:
      - fitness_db_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "unix_socket_directories="]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-fitness_user} -d ${POSTGRES_DB:-fitness_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fitness-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitness-app
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fitness_user}:${POSTGRES_PASSWORD:-fitness_password}@db:5432/${POSTGRES_DB:-fitness_db}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      APP_URL: ${APP_URL}
      APP_NAME: ${APP_NAME}
    ports:
      - "8054:3000"
    networks:
      - fitness-network
volumes:
  fitness_db_data:

networks:
  fitness-network:
    driver: bridge
