# Production deployment on CT117 Docker Hosting Platform
# Usage: docker compose -f docker-compose.ct117.yml up -d --build

services:
  db:
    image: postgres:15-alpine
    container_name: fitness-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - fitness_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fitness-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined

  app:
    build:
      context: .
      dockerfile: Dockerfile.runner
    container_name: fitness-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=768"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public"
    ports:
      - "${HOST_PORT:-8054}:3000"
    networks:
      - fitness-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2g
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  fitness_db_data:

networks:
  fitness-network:
    driver: bridge
